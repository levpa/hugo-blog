baseURL: https://levarc.com/
title: " "
theme: PaperMod

minify:
  disableXML: true
  minifyOutput: true

services:
  googleAnalytics:
    ID: G-KWYLJH7QDH

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableGitInfo: true
enableRobotsTXT: true
languageCode: en-us
defaultContentLanguage: en
canonifyURLs: true
paginattion:
  pagerSize: 10

permalinks:
  posts: /:year/:month/:slug
  page : /:slug
  services: /:slug

params:
  env: production
  author: Lev Pasichnyi
  subtitle: All about tech
  description: >
    LevArc delivers reproducible DevOps automation, cloud-native diagnostics, and strategic consulting for scalable infrastructure.
  keywords:
    ["Blog", "Automation", "DevOps", "SRE", "Azure", "AWS", "Solution architecture"]
  DateFormat: January 2, 2006
  LastModFormat: January 2, 2006

  homeInfoParams:
    Title: "LevArc — DevOps, Automation & Cloud"
    Content: "Delivering reproducible DevOps automation and scalable infrastructure."
 
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: false
  tocopen: false
  hidemeta: false

  comments: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  assets:
    favicon: /favicon.ico

  label:
    text: ""
    icon: /auto-transp.png
    iconHeight: 60

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  contact:
    email: support@levarc.com

markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineAnchors: ""
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    noClasses: true
    noHl: false
    style: monokai
    tabWidth: 2

  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: About
      url: /about/
      weight: 10

    - name: Services
      identifier: services
      url: /services/
      weight: 20

    - name: Topics
      url: /categories/
      weight: 30

    - name: Latest
      identifier: latest
      url: /latest/
      weight: 40

    - name: Contact
      url: /contact/
      weight: 50

resources:
  toCSS:
    transpiler: dartsass

caches:
  images:
    dir: :cacheDir/images
